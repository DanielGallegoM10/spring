<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de categorias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
</head>
<body>

<div class="container text-center mt-5">
    <h2 class="mb-4">Edición de Categoria</h2>
    <form th:action="@{'/categories/'+${category.id}+'/edit'}" method="POST">
        <input type="hidden" th:field="*{category.id}">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre de la categoria</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Ingrese el nombre de la categoria" th:value="*{category.name}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Descripcion de la categoria</label>
            <input type="text" class="form-control" id="description" name="description" placeholder="Ingrese la descripcion de la categoria" th:value="*{category.description}" required>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Imagen</label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*" th:value="*{category.image}" required>
        </div>
        <div class="mb-3 form-check">
            <label for="state" class="form-check-label">Estado</label>
            <input type="checkbox" class="form-check-input" id="state" name="state" th:value="*{category.state}" checked>
        </div>
        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a class="btn btn-secondary" th:href="@{/categories}">Volver</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>
</html>
